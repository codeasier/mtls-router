[package]
name = "router-identity"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[features]
test-support = ["dep:time"]

[dependencies]
router-contract = { path = "../router-contract" }
libc = "=0.2.186"
base64 = "=0.22.1"
ring = "=0.17.14"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider", "json"] }
tokio = { version = "=1.52.3", features = ["rt", "sync", "time", "macros"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "=1.15.1"
x509-parser = { version = "=0.18.1", features = ["verify"] }
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "pem", "ring"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
uuid = { version = "=1.21.0", features = ["v4"] }
zeroize = { version = "=1.8.2", features = ["serde"] }
time = { version = "=0.3.53", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
time = "=0.3.53"
