[package]
name = "router-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[features]
test-support = ["dep:rcgen"]

[dependencies]
router-contract = { path = "../router-contract" }
router-identity = { path = "../router-identity" }
bytes = "=1.12.1"
chrono = { version = "=0.4.44", default-features = false, features = ["clock", "std"] }
http = "=1.4.2"
http-body = "=1.0.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.10.1", default-features = false, features = ["http1", "client", "server"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["client-legacy", "http1", "server", "tokio"] }
rustls = { version = "=0.23.43", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pki-types = "=1.15.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["logging", "ring", "tls12"] }
zeroize = { version = "=1.8.2", features = ["serde"] }
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "pem", "ring"], optional = true }

[dev-dependencies]
router-identity = { path = "../router-identity", features = ["test-support"] }
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "pem", "ring"] }
