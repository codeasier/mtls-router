name: Question / Support
description: Ask a question or request help using mtls-router
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question about using mtls-router? Please include the commands and configuration details needed to understand your setup.

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: Describe what you'd like to know or what you're having trouble with.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: |
        Include relevant context: commands you ran, sanitized configuration, logs, OS, architecture, and how you installed or built mtls-router.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Before Asking
      options:
        - label: I have read the README
          required: true
        - label: I have searched existing issues for a similar question
          required: true
