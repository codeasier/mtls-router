name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          CLIENT_CERT_PEM: ${{ secrets.CLIENT_CERT_PEM }}
          CLIENT_KEY_PEM: ${{ secrets.CLIENT_KEY_PEM }}
          UPSTREAM_CA_PEM: ${{ secrets.UPSTREAM_CA_PEM }}
          UPSTREAM_URL: ${{ vars.UPSTREAM_URL }}
        run: |
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath \
            -ldflags "-s -w -X 'main.clientCertPEM=${CLIENT_CERT_PEM}' -X 'main.clientKeyPEM=${CLIENT_KEY_PEM}' -X 'main.upstreamCAPEM=${UPSTREAM_CA_PEM}' -X 'main.upstreamURL=${UPSTREAM_URL}' -X 'github.com/codeasier/mtls-router/internal/version.Version=${GITHUB_REF_NAME}' -X 'github.com/codeasier/mtls-router/internal/version.Commit=${GITHUB_SHA::12}' -X 'github.com/codeasier/mtls-router/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o "dist/mtls-router-${GOOS}-${GOARCH}${ext}" .
      - uses: actions/upload-artifact@v4
        with:
          name: mtls-router-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
      - name: Upload to download server
        if: startsWith(github.ref, 'refs/tags/')
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.UPLOAD_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ssh.codeasier.top
          REMOTE_USER: codeasier
          SOURCE: dist/
          TARGET: /home/codeasier/downloads/${{ github.event.repository.name }}/${{ github.ref_name }}/
          ARGS: -avz
      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  upload-installers:
    name: Upload installers to download server
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage installers
        run: |
          mkdir -p dist-installers
          cp setup.sh setup.ps1 dist-installers/
      - name: Upload installers
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.UPLOAD_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ssh.codeasier.top
          REMOTE_USER: codeasier
          SOURCE: dist-installers/
          TARGET: /home/codeasier/downloads/${{ github.event.repository.name }}/${{ github.ref_name }}/
          ARGS: -avz
      - name: Update latest symlink
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ssh.codeasier.top
          username: codeasier
          key: ${{ secrets.UPLOAD_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            repo='${{ github.event.repository.name }}'
            tag='${{ github.ref_name }}'
            base="/home/codeasier/downloads/$repo"
            test -d "$base/$tag"
            ln -sfn "$tag" "$base/latest.tmp"
            mv -Tf "$base/latest.tmp" "$base/latest"
