name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Desktop SemVer for a validation-only build
        required: true
        default: 0.1.0-dev
      target:
        description: OS and architecture to validate
        required: true
        type: choice
        default: all
        options:
          - all
          - windows-amd64
          - windows-arm64
          - darwin-amd64
          - darwin-arm64
          - linux-amd64
          - linux-arm64
      upstream_url:
        description: Optional HTTPS upstream override for this validation build
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare build matrices
    runs-on: ubuntu-latest
    outputs:
      cli-matrix: ${{ steps.matrix.outputs.cli-matrix }}
      desktop-matrix: ${{ steps.matrix.outputs.desktop-matrix }}
      online-update: ${{ steps.matrix.outputs.online-update }}
      simplify: ${{ steps.simplify.outputs.simplify }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize simplify setting
        id: simplify
        shell: bash
        env:
          SIMPLIFY: ${{ vars.SIMPLIFY }}
        run: |
          normalized="$(bash ./scripts/normalize-simplify.sh)"
          printf 'simplify=%s\n' "$normalized" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Preflight Agent model preset
        shell: bash
        env:
          AGENT_MODEL_PRESET_BASE64: ${{ vars.AGENT_MODEL_PRESET_BASE64 }}
        run: ./scripts/preflight-agent-model-preset.sh
      - name: Select build matrices
        id: matrix
        shell: bash
        env:
          SELECTED_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
          VALIDATION_UPSTREAM: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_url || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$VALIDATION_UPSTREAM" ]]; then
            [[ "$VALIDATION_UPSTREAM" == https://* && "$VALIDATION_UPSTREAM" != *[[:space:]\'\"]* ]] || {
              echo 'validation upstream must be an HTTPS URL without whitespace or quotes' >&2
              exit 1
            }
          fi
          cli='[
            {"name":"linux-amd64","goos":"linux","goarch":"amd64"},
            {"name":"linux-arm64","goos":"linux","goarch":"arm64"},
            {"name":"darwin-amd64","goos":"darwin","goarch":"amd64"},
            {"name":"darwin-arm64","goos":"darwin","goarch":"arm64"},
            {"name":"windows-amd64","goos":"windows","goarch":"amd64"},
            {"name":"windows-arm64","goos":"windows","goarch":"arm64"}
          ]'
          desktop='[
            {"name":"windows-amd64","runner":"windows-2025","target":"x86_64-pc-windows-msvc","os":"windows","arch":"amd64","bundles":"nsis"},
            {"name":"windows-arm64","runner":"windows-11-arm","target":"aarch64-pc-windows-msvc","os":"windows","arch":"arm64","bundles":"nsis"},
            {"name":"darwin-amd64","runner":"macos-15-intel","target":"x86_64-apple-darwin","os":"darwin","arch":"amd64","bundles":"dmg"},
            {"name":"darwin-arm64","runner":"macos-15","target":"aarch64-apple-darwin","os":"darwin","arch":"arm64","bundles":"dmg"},
            {"name":"linux-amd64","runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","os":"linux","arch":"amd64","bundles":"appimage"},
            {"name":"linux-arm64","runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","os":"linux","arch":"arm64","bundles":"appimage"}
          ]'
          if [[ "$SELECTED_TARGET" != all ]]; then
            cli="$(jq -c --arg target "$SELECTED_TARGET" '[.[] | select(.name == $target)]' <<<"$cli")"
            desktop="$(jq -c --arg target "$SELECTED_TARGET" '[.[] | select(.name == $target)]' <<<"$desktop")"
            [[ "$(jq length <<<"$cli")" -eq 1 && "$(jq length <<<"$desktop")" -eq 1 ]] || {
              echo "unsupported validation target: $SELECTED_TARGET" >&2
              exit 1
            }
          fi
          printf 'cli-matrix={"include":%s}\n' "$(jq -c . <<<"$cli")" >>"$GITHUB_OUTPUT"
          printf 'desktop-matrix={"include":%s}\n' "$(jq -c . <<<"$desktop")" >>"$GITHUB_OUTPUT"
          online_update=false
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then online_update=true; fi
          printf 'online-update=%s\n' "$online_update" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.cli-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare release version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$DISPATCH_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          printf 'RELEASE_VERSION=%s\n' "$version" >>"$GITHUB_ENV"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          CLIENT_CERT_PEM: ${{ secrets.CLIENT_CERT_PEM }}
          CLIENT_KEY_PEM: ${{ secrets.CLIENT_KEY_PEM }}
          UPSTREAM_CA_PEM: ${{ secrets.UPSTREAM_CA_PEM }}
          UPSTREAM_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_url || vars.UPSTREAM_URL }}
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
          AGENT_MODEL_PRESET_BASE64: ${{ vars.AGENT_MODEL_PRESET_BASE64 }}
          SIMPLIFY: ${{ needs.prepare.outputs.simplify }}
        run: |
          case "${DEPLOYMENT_ID:-}" in ""|dev|unknown) echo "DEPLOYMENT_ID must be a non-default production identifier" >&2; exit 1;; esac
          test -n "$CLIENT_CERT_PEM" && test -n "$CLIENT_KEY_PEM" && test -n "$UPSTREAM_CA_PEM"
          case "${UPSTREAM_URL:-}" in https://*) ;; *) echo "UPSTREAM_URL must use HTTPS" >&2; exit 1;; esac
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath \
            -ldflags "-s -w -X 'main.clientCertPEM=${CLIENT_CERT_PEM}' -X 'main.clientKeyPEM=${CLIENT_KEY_PEM}' -X 'main.upstreamCAPEM=${UPSTREAM_CA_PEM}' -X 'main.upstreamURL=${UPSTREAM_URL}' -X 'github.com/codeasier/mtls-router/internal/version.Version=${RELEASE_VERSION}' -X 'github.com/codeasier/mtls-router/internal/version.Commit=${GITHUB_SHA::12}' -X 'github.com/codeasier/mtls-router/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -X 'github.com/codeasier/mtls-router/internal/version.DeploymentID=${DEPLOYMENT_ID}'" \
             -o "dist/mtls-router-${GOOS}-${GOARCH}${ext}" .
          go build -trimpath \
            -ldflags "-s -w -X 'github.com/codeasier/mtls-router/internal/version.Version=${RELEASE_VERSION}' -X 'github.com/codeasier/mtls-router/internal/version.Commit=${GITHUB_SHA::12}' -X 'github.com/codeasier/mtls-router/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -X 'github.com/codeasier/mtls-router/internal/version.DeploymentID=${DEPLOYMENT_ID}' -X 'github.com/codeasier/mtls-router/internal/manager/preset.Encoded=${AGENT_MODEL_PRESET_BASE64}' -X 'github.com/codeasier/mtls-router/internal/manager/modelcatalog.Simplify=${SIMPLIFY}'" \
             -o "dist/mtls-router-manager-${GOOS}-${GOARCH}${ext}" ./cmd/mtls-router-manager
          printf '{"schema_version":1,"producer":"cli-%s-%s","management_protocol_version":"4"}\n' "$GOOS" "$GOARCH" >"dist/release-metadata-cli-${GOOS}-${GOARCH}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: mtls-router-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.desktop-matrix) }}
    env:
      CLIENT_CERT_PEM: ${{ secrets.CLIENT_CERT_PEM }}
      CLIENT_KEY_PEM: ${{ secrets.CLIENT_KEY_PEM }}
      UPSTREAM_CA_PEM: ${{ secrets.UPSTREAM_CA_PEM }}
      UPSTREAM_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_url || vars.UPSTREAM_URL }}
      DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
      AGENT_MODEL_PRESET_BASE64: ${{ vars.AGENT_MODEL_PRESET_BASE64 }}
      SIMPLIFY: ${{ needs.prepare.outputs.simplify }}
      MANAGEMENT_PROTOCOL_VERSION: '4'
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      ONLINE_UPDATE: ${{ needs.prepare.outputs.online-update }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run native occupant tests
        run: go test ./internal/manager/occupant -count=1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Use declared npm version
        shell: bash
        working-directory: desktop
        run: |
          npm_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "npm@${npm_version}"
          test "$(npm --version)" = "$npm_version"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: release-${{ matrix.target }}
      - name: Install Linux package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev xdg-utils xauth xvfb
      - run: npm ci
        working-directory: desktop
      - name: Prepare release version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_PUBKEY_SHA256: ${{ vars.TAURI_UPDATER_PUBKEY_SHA256 }}
          UPDATER_ENDPOINT: https://release.codeasier.top/latest.json
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$DISPATCH_VERSION"
          fi
          ./desktop/scripts/prepare-version.sh "$version"
          updater_config="$RUNNER_TEMP/tauri-updater.conf.json"
          ./desktop/scripts/prepare-updater-config.sh "$updater_config"
          printf 'TAURI_UPDATER_CONFIG=%s\n' "$updater_config" >>"$GITHUB_ENV"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'VERSION=%s\n' "$version" >>"$GITHUB_ENV"
      - name: Validate production inputs and build credential-injected sidecars
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_BUILD: '1'
        run: ./desktop/scripts/build-sidecars.sh
      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $path = Join-Path $env:RUNNER_TEMP 'mtls-router-signing.pfx'
          [IO.File]::WriteAllBytes($path, $bytes)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw 'Windows certificate import produced no thumbprint' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $router = "desktop/src-tauri/binaries/mtls-router-${{ matrix.target }}.exe"
          $manager = "desktop/src-tauri/binaries/mtls-router-manager-${{ matrix.target }}.exe"
          & signtool sign /sha1 $certificate.Thumbprint /fd sha256 /tr https://timestamp.digicert.com /td sha256 $router $manager
          if ($LASTEXITCODE -ne 0) { throw 'sidecar signing failed' }
      - name: Build unsigned Linux package
        if: runner.os == 'Linux'
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm exec tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$TAURI_UPDATER_CONFIG" --no-sign --ci
      - name: Build unsigned Windows package
        if: runner.os == 'Windows' && (env.WINDOWS_CERTIFICATE == '' || env.WINDOWS_CERTIFICATE_PASSWORD == '')
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm exec tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$env:TAURI_UPDATER_CONFIG" --no-sign --ci
      - name: Build signed Windows package
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          Push-Location desktop
          npm exec tauri -- build --target ${{ matrix.target }} --no-bundle --config "$env:TAURI_UPDATER_CONFIG" --no-sign --ci
          Pop-Location
          $desktop = "desktop/src-tauri/target/${{ matrix.target }}/release/mtls-router-desktop.exe"
          & signtool sign /sha1 $env:WINDOWS_CERTIFICATE_THUMBPRINT /fd sha256 /tr https://timestamp.digicert.com /td sha256 $desktop
          if ($LASTEXITCODE -ne 0) { throw 'desktop executable signing failed' }
          Push-Location desktop
          npm exec tauri -- bundle --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$env:TAURI_UPDATER_CONFIG" --no-sign --ci
          Pop-Location
          $package = (Get-ChildItem desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe).FullName
          & signtool sign /sha1 $env:WINDOWS_CERTIFICATE_THUMBPRINT /fd sha256 /tr https://timestamp.digicert.com /td sha256 $package
          if ($LASTEXITCODE -ne 0) { throw 'installer signing failed' }
          if ($env:ONLINE_UPDATE -eq 'true') {
            Push-Location desktop
            npm exec tauri -- signer sign "$package"
            Pop-Location
            if (-not (Test-Path "$package.sig")) { throw 'updater signature is missing' }
          }
      - name: Build unsigned macOS package
        if: runner.os == 'macOS' && (env.APPLE_CERTIFICATE == '' || env.APPLE_CERTIFICATE_PASSWORD == '')
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          codesign --force --sign - "src-tauri/binaries/mtls-router-${{ matrix.target }}"
          codesign --force --sign - "src-tauri/binaries/mtls-router-manager-${{ matrix.target }}"
          npm exec tauri -- build --target ${{ matrix.target }} --bundles app --config "$TAURI_UPDATER_CONFIG" --no-sign --ci
          app=src-tauri/target/${{ matrix.target }}/release/bundle/macos/CodeasierRouter.app
          codesign --force --sign - "$app/Contents/MacOS/mtls-router-desktop"
          codesign --force --sign - "$app"
          ./scripts/create-macos-dmg.sh ${{ matrix.target }} "$VERSION"
          ./scripts/create-macos-updater.sh ${{ matrix.target }}
      - name: Import macOS signing certificate and pre-sign sidecars
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' && env.APPLE_CERTIFICATE_PASSWORD != ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/mtls-router-signing.p12"
          keychain="$RUNNER_TEMP/mtls-router-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode >"$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$identity"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$identity" >>"$GITHUB_ENV"
          printf 'APPLE_SIGNING_KEYCHAIN=%s\n' "$keychain" >>"$GITHUB_ENV"
          codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$identity" desktop/src-tauri/binaries/mtls-router-${{ matrix.target }}
          codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$identity" desktop/src-tauri/binaries/mtls-router-manager-${{ matrix.target }}
      - name: Create signed macOS package
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' && env.APPLE_CERTIFICATE_PASSWORD != ''
        shell: bash
        run: |
          cd desktop
          npm exec tauri -- build --target ${{ matrix.target }} --bundles app --config "$TAURI_UPDATER_CONFIG" --no-sign --ci
          app=src-tauri/target/${{ matrix.target }}/release/bundle/macos/CodeasierRouter.app
          codesign --force --options runtime --timestamp --keychain "$APPLE_SIGNING_KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" "$app/Contents/MacOS/mtls-router-desktop"
          codesign --force --options runtime --timestamp --keychain "$APPLE_SIGNING_KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" "$app"
          if [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/mtls-router-notarization.zip"
            xcrun notarytool submit "$RUNNER_TEMP/mtls-router-notarization.zip" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$app"
          fi
          ./scripts/create-macos-dmg.sh ${{ matrix.target }} "$VERSION"
          codesign --force --timestamp --keychain "$APPLE_SIGNING_KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/CodeasierRouter_${VERSION}.dmg"
          ./scripts/create-macos-updater.sh ${{ matrix.target }}
      - name: Sign final Linux or unsigned Windows updater package
        if: env.ONLINE_UPDATE == 'true' && (runner.os == 'Linux' || (runner.os == 'Windows' && (env.WINDOWS_CERTIFICATE == '' || env.WINDOWS_CERTIFICATE_PASSWORD == '')))
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ '${{ runner.os }}' == Linux ]]; then
            package="$(printf '%s\n' desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)"
          else
            package="$(printf '%s\n' desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe)"
          fi
          [[ -f "$package" ]]
          (cd desktop && npm exec tauri -- signer sign "$GITHUB_WORKSPACE/$package")
          [[ -s "$package.sig" ]]
      - name: Inspect package and sidecars
        shell: bash
        env:
          PACKAGE_OUTPUT_DIR: ${{ github.workspace }}/desktop/release-artifacts
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: ./desktop/scripts/verify-package.sh ${{ matrix.target }}
      - name: Record release protocol metadata
        shell: bash
        run: printf '{"schema_version":1,"producer":"desktop-%s-%s","management_protocol_version":"%s"}\n' '${{ matrix.os }}' '${{ matrix.arch }}' "$MANAGEMENT_PROTOCOL_VERSION" >desktop/release-artifacts/release-metadata-desktop-${{ matrix.os }}-${{ matrix.arch }}.json
      - name: Record Linux signing status
        if: runner.os == 'Linux'
        shell: bash
        run: printf '%s\n' 'unsigned (Linux package signing is not configured)' >desktop/release-artifacts/signing-status-${{ matrix.os }}-${{ matrix.arch }}.txt
      - name: Validate and record unsigned Windows status
        if: runner.os == 'Windows' && (env.WINDOWS_CERTIFICATE == '' || env.WINDOWS_CERTIFICATE_PASSWORD == '')
        shell: pwsh
        run: |
          $package = Get-ChildItem desktop/release-artifacts/CodeasierRouter-windows-${{ matrix.arch }}.exe
          if ((Get-AuthenticodeSignature $package).Status -eq 'Valid') { throw 'unsigned build unexpectedly has a valid signature' }
          $status="unsigned (credentials unavailable)"
          Set-Content desktop/release-artifacts/signing-status-${{ matrix.os }}-${{ matrix.arch }}.txt $status
      - name: Validate and record signed Windows status
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $package = Get-ChildItem desktop/release-artifacts/CodeasierRouter-windows-${{ matrix.arch }}.exe
          if ((Get-AuthenticodeSignature $package).Status -ne 'Valid') { throw 'signed Windows package failed Authenticode validation' }
          $inspection = Join-Path $env:RUNNER_TEMP 'signed-package'
          7z x -y "-o$inspection" $package | Out-Null
          foreach ($name in @('mtls-router-desktop.exe', 'mtls-router.exe', 'mtls-router-manager.exe')) {
            $binary = Get-ChildItem $inspection -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $binary -or (Get-AuthenticodeSignature $binary).Status -ne 'Valid') { throw "$name failed Authenticode validation" }
          }
          $status="signed"
          Set-Content desktop/release-artifacts/signing-status-${{ matrix.os }}-${{ matrix.arch }}.txt $status
      - name: Validate and record fallback macOS status
        if: runner.os == 'macOS' && (env.APPLE_CERTIFICATE == '' || env.APPLE_CERTIFICATE_PASSWORD == '')
        shell: bash
        run: |
          status="ad-hoc signed (not trusted by Gatekeeper)"
          printf '%s\n' "$status" >desktop/release-artifacts/signing-status-${{ matrix.os }}-${{ matrix.arch }}.txt
      - name: Validate and record signed macOS status
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && (env.APPLE_ID == '' || env.APPLE_PASSWORD == '' || env.APPLE_TEAM_ID == '')
        shell: bash
        run: |
          codesign --verify --deep --strict desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/CodeasierRouter.app
          codesign --verify --strict desktop/release-artifacts/CodeasierRouter-darwin-${{ matrix.arch }}.dmg
          status="signed (notarization credentials unavailable)"
          printf '%s\n' "$status" >desktop/release-artifacts/signing-status-${{ matrix.os }}-${{ matrix.arch }}.txt
      - name: Validate and record signed and notarized macOS status
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.APPLE_ID != '' && env.APPLE_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        shell: bash
        run: |
          app=desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/CodeasierRouter.app
          codesign --verify --deep --strict "$app"
          codesign --verify --strict desktop/release-artifacts/CodeasierRouter-darwin-${{ matrix.arch }}.dmg
          spctl --assess --type execute "$app"
          xcrun stapler validate "$app"
          status="signed and notarized"
          printf '%s\n' "$status" >desktop/release-artifacts/signing-status-${{ matrix.os }}-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CodeasierRouter-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: desktop/release-artifacts/*
          if-no-files-found: error

  release:
    name: Package and publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: mtls-router-cli-*
          path: binaries
          merge-multiple: true
      - name: Download all desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: CodeasierRouter-desktop-*
          path: desktop-packages
          merge-multiple: true
      - name: Collect protocol metadata
        run: |
          mkdir protocol-metadata
          mv binaries/release-metadata-*.json desktop-packages/release-metadata-*.json protocol-metadata/
      - name: Preflight and package
        env:
          DOWNLOAD_BASE_URL: https://downloads.codeasier.top/${{ github.event.repository.name }}/${{ github.ref_name }}
          DESKTOP_DOWNLOAD_BASE_URL: https://release.codeasier.top/${{ github.event.repository.name }}/${{ github.ref_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_DATE_EPOCH: '0'
        run: ./scripts/package-release.sh
      - name: Validate stable GitHub channel advancement
        if: needs.prepare.outputs.online-update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          current_latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [[ -n "$current_latest" ]]; then
            [[ "$current_latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$(printf '%s\n%s\n' "$current_latest" "$RELEASE_TAG" | sort -V | tail -n1)" = "$RELEASE_TAG"
          fi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          prerelease: ${{ needs.prepare.outputs.online-update != 'true' }}
          make_latest: ${{ needs.prepare.outputs.online-update == 'true' }}
      - name: Ensure remote release directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ssh.codeasier.top
          username: codeasier
          key: ${{ secrets.UPLOAD_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            mkdir -p "/home/codeasier/downloads/${{ github.event.repository.name }}/${{ github.ref_name }}"
      - name: Mirror staged release
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.UPLOAD_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ssh.codeasier.top
          REMOTE_USER: codeasier
          SOURCE: release/
          TARGET: /home/codeasier/downloads/${{ github.event.repository.name }}/${{ github.ref_name }}/
          # The target is isolated to this repository tag, so deletion only removes stale assets for this release.
          ARGS: -avz --delete
      - name: Update latest symlink
        if: needs.prepare.outputs.online-update == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ssh.codeasier.top
          username: codeasier
          key: ${{ secrets.UPLOAD_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            repo='${{ github.event.repository.name }}'
            tag='${{ github.ref_name }}'
            base="/home/codeasier/downloads/$repo"
            test -d "$base/$tag"
            test ! -e "$base/latest" || test -L "$base/latest"
            if test -L "$base/latest"; then
              current="$(basename "$(readlink "$base/latest")")"
              [[ "$current" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
              test "$(printf '%s\n%s\n' "$current" "$tag" | sort -V | tail -n1)" = "$tag"
            fi
            ln -sfn "$tag" "$base/latest.tmp"
            mv -Tf "$base/latest.tmp" "$base/latest"
