name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-shell:
    name: Go and shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Shell tests
        run: make test-shell
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  frontend:
    name: Frontend static, type, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Use declared npm version
        shell: bash
        run: |
          npm_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "npm@${npm_version}"
          test "$(npm --version)" = "$npm_version"
      - run: npm ci
      - run: npm run static:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-24.04
          - os: macOS
            runner: macos-15
          - os: Windows
            runner: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Build host sidecars
        shell: bash
        run: ./desktop/scripts/build-sidecars.sh
      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all -- --check
      - name: Run Rust tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked

  desktop-package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: 0.1.0
      DEPLOYMENT_ID: dev
      MANAGEMENT_PROTOCOL_VERSION: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Use declared npm version
        shell: bash
        working-directory: desktop
        run: |
          npm_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "npm@${npm_version}"
          test "$(npm --version)" = "$npm_version"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}
      - name: Install Linux package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - run: npm ci
        working-directory: desktop
      - name: Build target sidecars
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: ./desktop/scripts/build-sidecars.sh
      - name: Build unsigned package for validation
        working-directory: desktop
        run: npm exec tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --no-sign --ci
      - name: Inspect package and sidecars
        shell: bash
        run: ./desktop/scripts/verify-package.sh ${{ matrix.target }}

  workflow-static:
    name: Workflow static assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-workflows
