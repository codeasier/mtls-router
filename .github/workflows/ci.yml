name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  scope:
    name: Scope and workflow assertions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      package: ${{ steps.filter.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            ci:
              - '.github/workflows/ci.yml'
              - 'Makefile'
            go:
              - '*.go'
              - 'cmd/**/*.go'
              - 'internal/**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'setup.sh'
              - 'setup.ps1'
              - 'scripts/**'
              - 'tests/setup_*.sh'
              - 'Dockerfile'
              - 'systemd/**'
              - 'deploy/**'
              - 'testdata/router-mtls-v1/**'
            frontend:
              - 'desktop/src/**'
              - 'desktop/package.json'
              - 'desktop/package-lock.json'
              - 'desktop/.npmrc'
              - 'desktop/.prettierignore'
              - 'desktop/index.html'
              - 'desktop/app-icon.svg'
              - 'desktop/src-tauri/tauri.conf.json'
              - 'desktop/src-tauri/capabilities/default.json'
              - 'desktop/eslint.config.js'
              - 'desktop/tsconfig.json'
              - 'desktop/vite.config.ts'
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'cli/**'
              - 'testdata/**'
              - 'scripts/public-trust.rs'
              - 'desktop/src-tauri/**'
              - 'internal/manager/**'
              - 'internal/routerenroll/**'
              - 'cmd/codeasier-router-enroll/**'
              - 'deploy/nginx/**'
              - 'go.mod'
              - 'go.sum'
            package:
              - 'scripts/public-trust.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'cli/**'
              - 'desktop/**'
      - run: make test-workflows

  go-shell:
    name: Go and shell
    needs: scope
    if: needs.scope.outputs.go == 'true' || needs.scope.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Shell tests
        run: make test-shell
      - name: Install real nginx for enrollment TLS and CRL integration
        run: sudo apt-get update && sudo apt-get install -y nginx procps lsof
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  frontend:
    name: Frontend static, type, test, and build
    needs: scope
    if: github.event_name == 'pull_request' && (needs.scope.outputs.frontend == 'true' || needs.scope.outputs.ci == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Use declared npm version
        shell: bash
        run: |
          npm_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "npm@${npm_version}"
          test "$(npm --version)" = "$npm_version"
      - run: npm ci
      - run: npm run static:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  shared-rust:
    name: Headless shared Rust (${{ matrix.runner }})
    needs: scope
    if: needs.scope.outputs.rust == 'true' || needs.scope.outputs.ci == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test shared crates without GUI system packages
        run: cargo test --locked -p router-contract -p router-core -p router-identity -p codeasier-router
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install nginx without GUI packages
        run: sudo apt-get update && sudo apt-get install -y nginx procps lsof
      - name: Rust native through real nginx and Go enrollment
        env:
          MTLS_TEST_RUST_NATIVE: '1'
        run: go test ./internal/routerenroll -run TestRealNginxRenewalAndObservedCRLLoad -count=1 -v

  rust:
    name: Rust (${{ matrix.os }})
    needs: scope
    if: github.event_name == 'pull_request' && (needs.scope.outputs.rust == 'true' || needs.scope.outputs.ci == 'true')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-24.04
          - os: macOS
            runner: macos-15
          - os: Windows
            runner: windows-2025
          - os: Windows ARM64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run native occupant tests
        run: go test ./internal/manager/occupant -count=1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev xdg-utils
      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all -- --check
      - name: Run Rust tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --workspace

  desktop-package:
    name: Package ${{ matrix.target }}
    needs: scope
    if: github.event_name == 'pull_request' && (needs.scope.outputs.package == 'true' || needs.scope.outputs.ci == 'true')
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: 0.1.0
      DEPLOYMENT_ID: dev
      MANAGEMENT_PROTOCOL_VERSION: '4'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Use declared npm version
        shell: bash
        working-directory: desktop
        run: |
          npm_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "npm@${npm_version}"
          test "$(npm --version)" = "$npm_version"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.target }}
      - name: Install Linux package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev xdg-utils xauth xvfb
      - run: npm ci
        working-directory: desktop
      - name: Build unsigned package for validation
        working-directory: desktop
        run: npm exec tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --no-sign --ci
      - name: Inspect package
        shell: bash
        run: ./desktop/scripts/verify-package.sh ${{ matrix.target }}
