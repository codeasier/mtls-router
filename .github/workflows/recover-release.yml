name: Recover Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish without moving it
        required: true
        type: string
      source_run_id:
        description: Failed tag Release run whose successful artifacts will be reused
        required: true
        type: string

concurrency:
  group: release-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Validate and package existing tag
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      tag_sha: ${{ steps.validate.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate recovery source
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          source_run_id="$SOURCE_RUN_ID"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$source_run_id" =~ ^[0-9]+$ ]]

          git fetch --force origin "refs/tags/$release_tag:refs/tags/$release_tag"
          tag_sha="$(git rev-parse "$release_tag^{commit}")"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id")"
          RUN="$run" TAG_SHA="$tag_sha" RELEASE_TAG="$release_tag" python3 - <<'PY'
          import json
          import os

          run = json.loads(os.environ["RUN"])
          tag_sha = os.environ["TAG_SHA"]
          release_tag = os.environ["RELEASE_TAG"]
          workflow_id = run["path"]
          event = run["event"]
          head_branch = run["head_branch"]
          head_sha = run["head_sha"]
          conclusion = run["conclusion"]
          assert workflow_id == ".github/workflows/release.yml"
          assert event == "push"
          assert head_branch == release_tag
          assert head_sha == tag_sha
          assert conclusion == "failure"
          PY

          jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/jobs?per_page=100" --jq '.jobs[] | [.name,.conclusion] | @tsv')"
          expected_jobs=(
            'Build linux/amd64'
            'Build linux/arm64'
            'Build darwin/amd64'
            'Build darwin/arm64'
            'Build windows/amd64'
            'Build windows/arm64'
            'Desktop x86_64-pc-windows-msvc'
            'Desktop aarch64-pc-windows-msvc'
            'Desktop x86_64-apple-darwin'
            'Desktop aarch64-apple-darwin'
            'Desktop x86_64-unknown-linux-gnu'
            'Desktop aarch64-unknown-linux-gnu'
          )
          test "$(printf '%s\n' "$jobs" | wc -l)" -eq 13
          for name in "${expected_jobs[@]}"; do
            test "$(printf '%s\n' "$jobs" | awk -F '\t' -v name="$name" '$1 == name && $2 == "success" { count++ } END { print count+0 }')" -eq 1
          done
          test "$(printf '%s\n' "$jobs" | awk -F '\t' '$1 == "Package and publish release" && $2 == "failure" { count++ } END { print count+0 }')" -eq 1

          artifacts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100" --jq '.artifacts[] | [.name,.expired] | @tsv')"
          expected_artifacts=(
            mtls-router-cli-linux-amd64
            mtls-router-cli-linux-arm64
            mtls-router-cli-darwin-amd64
            mtls-router-cli-darwin-arm64
            mtls-router-cli-windows-amd64
            mtls-router-cli-windows-arm64
            CodeasierRouter-desktop-windows-amd64
            CodeasierRouter-desktop-windows-arm64
            CodeasierRouter-desktop-darwin-amd64
            CodeasierRouter-desktop-darwin-arm64
            CodeasierRouter-desktop-linux-amd64
            CodeasierRouter-desktop-linux-arm64
          )
          test "$(printf '%s\n' "$artifacts" | wc -l)" -eq 12
          for name in "${expected_artifacts[@]}"; do
            test "$(printf '%s\n' "$artifacts" | awk -F '\t' -v name="$name" '$1 == name && $2 == "false" { count++ } END { print count+0 }')" -eq 1
          done

          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --slurp)"
          RELEASES="$releases" RELEASE_TAG="$release_tag" python3 - <<'PY'
          import json
          import os

          pages = json.loads(os.environ["RELEASES"])
          matches = [release for page in pages for release in page if release["tag_name"] == os.environ["RELEASE_TAG"]]
          assert len(matches) <= 1
          if matches:
              assert matches[0]["prerelease"] is False
          PY
          printf 'tag_sha=%s\n' "$tag_sha" >>"$GITHUB_OUTPUT"
      - name: Download all binaries from source run
        uses: actions/download-artifact@v4
        with:
          pattern: mtls-router-cli-*
          path: binaries
          merge-multiple: true
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Download all desktop packages from source run
        uses: actions/download-artifact@v4
        with:
          pattern: CodeasierRouter-desktop-*
          path: desktop-packages
          merge-multiple: true
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Collect protocol metadata
        run: |
          mkdir protocol-metadata
          mv binaries/release-metadata-*.json desktop-packages/release-metadata-*.json protocol-metadata/
      - name: Preflight and package
        env:
          DOWNLOAD_BASE_URL: https://downloads.codeasier.top/${{ github.event.repository.name }}/${{ inputs.release_tag }}
          DESKTOP_DOWNLOAD_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_DATE_EPOCH: '0'
        run: ./scripts/package-release.sh
      - name: Upload assembled release
        uses: actions/upload-artifact@v4
        with:
          name: recovered-release-${{ inputs.release_tag }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish recovered release
    needs: package
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download assembled release
        uses: actions/download-artifact@v4
        with:
          name: recovered-release-${{ inputs.release_tag }}
          path: release
      - name: Validate recovered updater assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DESKTOP_DOWNLOAD_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS)
          jq -e --arg version "${RELEASE_TAG#v}" --arg base "$DESKTOP_DOWNLOAD_BASE_URL/" '
            .version == $version and
            (.platforms | keys | sort) == ([
              "darwin-aarch64", "darwin-x86_64", "linux-aarch64",
              "linux-x86_64", "windows-aarch64", "windows-x86_64"
            ] | sort) and
            ([.platforms[] | select((.signature | length) == 0 or (.url | startswith($base) | not))] | length) == 0
          ' release/latest.json >/dev/null
          while read -r target name; do
            test -s "release/$name"
            test -s "release/$name.sig"
            test "$(jq -r --arg target "$target" '.platforms[$target].url' release/latest.json)" = "$DESKTOP_DOWNLOAD_BASE_URL/$name"
            test "$(jq -r --arg target "$target" '.platforms[$target].signature' release/latest.json)" = "$(cat "release/$name.sig")"
          done <<'TARGETS'
          linux-x86_64 CodeasierRouter-linux-amd64.AppImage
          linux-aarch64 CodeasierRouter-linux-arm64.AppImage
          windows-x86_64 CodeasierRouter-windows-amd64.exe
          windows-aarch64 CodeasierRouter-windows-arm64.exe
          darwin-x86_64 CodeasierRouter-darwin-amd64.app.tar.gz
          darwin-aarch64 CodeasierRouter-darwin-arm64.app.tar.gz
          TARGETS
      - name: Revalidate tag and prepare draft Release
        id: prepare-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ needs.package.outputs.tag_sha }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
          test "$tag_sha" = "$EXPECTED_SHA"
          current_latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [[ -n "$current_latest" ]]; then
            test "$(printf '%s\n%s\n' "$current_latest" "$RELEASE_TAG" | sort -V | tail -n1)" = "$RELEASE_TAG"
          fi
          find_release() {
            local releases
            releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --slurp)"
            RELEASES="$releases" RELEASE_TAG="$RELEASE_TAG" EXPECTED_SHA="$EXPECTED_SHA" python3 - <<'PY'
          import json
          import os

          pages = json.loads(os.environ["RELEASES"])
          matches = [release for page in pages for release in page if release["tag_name"] == os.environ["RELEASE_TAG"]]
          assert len(matches) <= 1
          if matches:
              release = matches[0]
              assert release["prerelease"] is False
              if release["draft"]:
                  assert release["target_commitish"] == os.environ["EXPECTED_SHA"]
              print(f'{release["id"]}\t{str(release["draft"]).lower()}')
          PY
          }
          release_record="$(find_release)"
          if [[ -z "$release_record" ]]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$RELEASE_TAG" --target "$EXPECTED_SHA"
            release_record="$(find_release)"
            test -n "$release_record"
          fi
          IFS=$'\t' read -r release_id release_is_draft <<<"$release_record"
          test -n "$release_id"
          printf '%s\n' release/* | sed 's#^release/##' | LC_ALL=C sort >expected-assets.txt
          if [[ "$release_is_draft" == true ]]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[].id' | while read -r asset_id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done
            for asset in release/*; do
              gh api --method POST \
                -H 'Content-Type: application/octet-stream' \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$(basename "$asset")" \
                --input "$asset" >/dev/null
            done
          else
            test "$release_is_draft" = false
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[].name' | LC_ALL=C sort >actual-assets.txt
          cmp expected-assets.txt actual-assets.txt
          printf 'release_id=%s\n' "$release_id" >>"$GITHUB_OUTPUT"
      - name: Ensure remote release directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ssh.codeasier.top
          username: codeasier
          key: ${{ secrets.UPLOAD_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            mkdir -p "/home/codeasier/downloads/${{ github.event.repository.name }}/${{ inputs.release_tag }}"
      - name: Mirror staged release
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.UPLOAD_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ssh.codeasier.top
          REMOTE_USER: codeasier
          SOURCE: release/
          TARGET: /home/codeasier/downloads/${{ github.event.repository.name }}/${{ inputs.release_tag }}/
          ARGS: -avz --delete
      - name: Revalidate tag before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ needs.package.outputs.tag_sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')" = "$EXPECTED_SHA"
      - name: Publish draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F make_latest=true >/dev/null
      - name: Update latest symlink
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ssh.codeasier.top
          username: codeasier
          key: ${{ secrets.UPLOAD_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            repo='${{ github.event.repository.name }}'
            tag='${{ inputs.release_tag }}'
            base="/home/codeasier/downloads/$repo"
            test -d "$base/$tag"
            test ! -e "$base/latest" || test -L "$base/latest"
            if test -L "$base/latest"; then
              current="$(basename "$(readlink "$base/latest")")"
              [[ "$current" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
              test "$(printf '%s\n%s\n' "$current" "$tag" | sort -V | tail -n1)" = "$tag"
            fi
            ln -sfn "$tag" "$base/latest.tmp"
            mv -Tf "$base/latest.tmp" "$base/latest"
