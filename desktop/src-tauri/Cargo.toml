[package]
name = "mtls-router-desktop"
version = "0.1.0"
description = "Desktop control panel for CodeasierRouter"
authors = ["CodeasierRouter contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mtls_router_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
object = "=0.37.3"
sha2 = "=0.10.9"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.44", default-features = false, features = ["clock", "std"] }
libc = "=0.2.186"
minisign-verify = "=0.2.5"
object = "=0.37.3"
rfd = "=0.15.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
semver = "=1.0.28"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-opener = "=2.5.3"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-updater = "=2.10.1"
tokio = { version = "=1.52.3", features = ["macros", "sync", "time", "net", "io-util"] }
thiserror = "=2.0.18"
uuid = { version = "=1.21.0", features = ["v4"] }
zeroize = { version = "=1.8.2", features = ["serde"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "=2.4.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "=3.20.0"
