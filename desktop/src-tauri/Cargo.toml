[package]
name = "mtls-router-desktop"
version = "0.1.0"
description = "Desktop control panel for CodeasierRouter"
authors = ["CodeasierRouter contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mtls_router_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "pem", "ring"] }
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
bytes = "=1.12.1"
chrono = { version = "=0.4.44", default-features = false, features = ["clock", "std"] }
dirs = "=5.0.1"
http = "=1.4.2"
http-body = "=1.0.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.10.1", default-features = false, features = ["http1", "client", "server"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["client-legacy", "http1", "server", "tokio"] }
libc = "=0.2.186"
minisign-verify = "=0.2.5"
rfd = "=0.15.4"
regex = "=1.13.0"
rustls = { version = "=0.23.43", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pki-types = "=1.15.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
semver = "=1.0.28"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-opener = "=2.5.3"
tauri-plugin-updater = "=2.10.1"
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["logging", "ring", "tls12"] }
thiserror = "=2.0.18"
toml = "=0.8.2"
unicode-segmentation = "=1.12.0"
uuid = { version = "=1.21.0", features = ["v4"] }
zeroize = { version = "=1.8.2", features = ["serde"] }
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "=2.4.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_ProcessStatus", "Win32_System_RemoteDesktop", "Win32_System_Services", "Win32_System_Threading"] }

[dev-dependencies]
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "pem", "ring"] }
