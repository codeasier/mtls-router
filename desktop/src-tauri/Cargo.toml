[package]
name = "mtls-router-desktop"
version = "0.1.0"
description = "Desktop control panel for mtls-router"
authors = ["mtls-router contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mtls_router_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
object = "=0.37.3"
sha2 = "=0.10.9"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono = { version = "=0.4.44", default-features = false, features = ["clock", "std"] }
libc = "=0.2.186"
object = "=0.37.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-opener = "=2.5.3"
tauri-plugin-shell = "=2.3.5"
tokio = { version = "=1.52.3", features = ["macros", "sync", "time"] }
uuid = { version = "=1.21.0", features = ["v4"] }
zeroize = "=1.8.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "=2.4.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
